<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Danloader</title><link rel="stylesheet" href="popup.css"></head><body>
<header><div><h1>Danloader</h1><p class="subtitle">Качай всё, что надо, без ограничений</p></div><div class="header-actions"><button id="refresh" class="icon-button" title="Обновить список" aria-label="Обновить список"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 7v5h-5"/><path d="M19.1 15a7.5 7.5 0 1 1-.7-8.4L20 8"/></svg></button><button id="clear" class="icon-button" title="Очистить завершённые" aria-label="Очистить завершённые"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 6h18M9 6V4h6v2M5 6l1 14h12l1-14M10 10v6M14 10v6"/></svg></button><span class="header-divider" aria-hidden="true"></span><div class="language-picker" id="language-picker"><button id="language-toggle" class="language-toggle" type="button" aria-label="Язык" aria-haspopup="listbox" aria-expanded="false" aria-controls="language-options"><img id="language-flag" src="assets/flags/ru.svg" alt="" width="18" height="12"><span id="language-name">RU</span></button><div id="language-options" class="language-options" role="listbox" aria-label="Язык" hidden><button type="button" role="option" data-language="ru" aria-selected="true" tabindex="-1"><img src="assets/flags/ru.svg" alt="" width="18" height="12">RU</button><button type="button" role="option" data-language="en" aria-selected="false" tabindex="-1"><img src="assets/flags/en.svg" alt="" width="18" height="12">EN</button></div></div></div></header>
<section class="save-location" aria-label="Место сохранения для всех видео"><div><span>Сохранять в</span><strong id="destination-name">Папка загрузок браузера</strong></div><div class="destination-actions"><button id="browser-destination" class="selected-destination" aria-pressed="true" disabled>Загрузки</button><button id="choose-destination" aria-pressed="false">Выбрать</button></div></section>
<p class="hint">Включите воспроизведение, чтобы обнаружить потоки.</p>
<p id="error" role="alert" hidden></p>
<section id="downloads" aria-label="Скачивания"></section>
<section id="media" aria-label="Найденные видео"><p class="empty">Ищем видео…</p></section>
<footer class="credits">Сделал Dan Shulgin — <a href="https://github.com/karozero/danloader" target="_blank" rel="noopener noreferrer">github.com/karozero/danloader</a></footer>
<script type="module" src="popup.js"></script></body></html>
